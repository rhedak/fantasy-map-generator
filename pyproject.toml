[project]
name = "fantasy-map-generator"
version = "0.1.0"
description = "Procedurally generates fantasy world maps as parametric SVG, with a Python package and interactive GUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henrik Hanssen" }]
keywords = ["svg", "map", "generator", "fantasy", "procedural", "world-building"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]

# The SVG generation has no dependencies: a map is text, written with stdlib.
# PNG export needs cairo (optional). The interactive web tool runs in the
# browser via Pyodide, so it needs no server-side framework.
dependencies = []

[project.optional-dependencies]
png = ["cairosvg>=2.7"]

[dependency-groups]
dev = [
    "fantasy-map-generator[png]",
    "pytest>=8",
    "ruff>=0.14",
    "pdoc>=15",
]

[project.scripts]
fantasy-map-generator = "fantasy_map_generator.cli:main"

[project.urls]
Repository = "https://github.com/rhedak/fantasy-map-generator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_map_generator"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "web"]
extend-exclude = ["*.md", "out"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehension rewrites
    "SIM",  # simplifications
    "RUF",  # ruff rules
]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
